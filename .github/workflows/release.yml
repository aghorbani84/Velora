name: VELORA Release & APK Publisher

on:
  push:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v2.1.0)'
        required: false
        default: 'v2.1.0'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: velora-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, Sign & Publish VELORA APK Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install API 36.1
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-36.1" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Resolve Release Version & Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version_tag }}" ]; then
            TAG_NAME="${{ inputs.version_tag }}"
            IS_PRERELEASE="${{ inputs.prerelease }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            IS_PRERELEASE="false"
          else
            TAG_NAME="v2.1.0"
            IS_PRERELEASE="false"
          fi
          VERSION_CLEAN="${TAG_NAME#v}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_CLEAN}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Prepare Signing Keystores & Environment
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          # Ensure debug.keystore is present
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Prepare release signing keystore
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=${STORE_PASSWORD_SECRET}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASSWORD_SECRET}" >> "$GITHUB_ENV"
          else
            rm -f my-upload-key.jks
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass velora_release_key \
              -alias upload \
              -keypass velora_release_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=VELORA Multimedia,OU=Engineering,O=VELORA,C=US"
            echo "STORE_PASSWORD=velora_release_key" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=velora_release_key" >> "$GITHUB_ENV"
          fi

      - name: Assemble Signed Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug -x lint -x lintVitalRelease --parallel

      - name: Package Release Artifacts & Checksums
        id: package
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag_name }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/VELORA-v${VERSION}-release-signed.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/VELORA-v${VERSION}-universal-debug.apk"
          cd dist
          sha256sum VELORA-*.apk > SHA256SUMS.txt
          md5sum VELORA-*.apk > MD5SUMS.txt
          cat SHA256SUMS.txt

          {
            echo "## ✨ VELORA — Beyond Playback (${TAG})"
            echo ""
            echo "**VELORA** is an intelligent, privacy-first multimedia platform engineered with **Kotlin**, **Jetpack Compose (Material 3 Dark Saffron & Champagne Gold)**, **Media3 ExoPlayer**, a **10-Band Cascaded Peaking Biquad DSP Equalizer**, **Goertzel Real-Time Spectrum & Waveform Analyzer**, **Room v3 Offline Cache**, and **Sandboxed Declarative Plugins**."
            echo ""
            echo "### 📥 Direct APK Downloads (دانلود مستقیم نسخه نصبی اندروید)"
            echo ""
            echo "| File | Type | Architecture | Android Version |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **\`VELORA-v${VERSION}-release-signed.apk\`** | **Recommended Production APK** (Signed Release) | Universal (\`arm64-v8a\`, \`armeabi-v7a\`, \`x86_64\`) | Android 8.0+ (API 26+) |"
            echo "| **\`VELORA-v${VERSION}-universal-debug.apk\`** | Developer / Testing APK | Universal (\`arm64-v8a\`, \`armeabi-v7a\`, \`x86_64\`) | Android 8.0+ (API 26+) |"
            echo "| **\`SHA256SUMS.txt\`** | SHA-256 Checksum Manifest | Text | — |"
            echo ""
            echo "### 🔐 SHA-256 Checksums"
            echo "\`\`\`text"
            cat SHA256SUMS.txt
            echo "\`\`\`"
          } > RELEASE_NOTES.md

      - name: Upload APK Bundle to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VELORA-${{ steps.meta.outputs.tag_name }}-apk-bundle
          path: |
            dist/VELORA-*.apk
            dist/SHA256SUMS.txt
            dist/MD5SUMS.txt
          if-no-files-found: error

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag_name }}"
          VERSION="${{ steps.meta.outputs.version }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "VELORA ${TAG} — Beyond Playback" \
              --notes-file dist/RELEASE_NOTES.md \
              --target "${GITHUB_SHA}" \
              --latest
            gh release upload "$TAG" \
              "dist/VELORA-v${VERSION}-release-signed.apk" \
              "dist/VELORA-v${VERSION}-universal-debug.apk" \
              "dist/SHA256SUMS.txt" \
              "dist/MD5SUMS.txt" \
              --clobber
          else
            gh release create "$TAG" \
              "dist/VELORA-v${VERSION}-release-signed.apk" \
              "dist/VELORA-v${VERSION}-universal-debug.apk" \
              "dist/SHA256SUMS.txt" \
              "dist/MD5SUMS.txt" \
              --title "VELORA ${TAG} — Beyond Playback" \
              --notes-file dist/RELEASE_NOTES.md \
              --target "${GITHUB_SHA}" \
              --latest
          fi
