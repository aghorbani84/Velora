name: VELORA Release & APK Publisher

on:
  push:
    branches:
      - main
      - master
      - '**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v2.3.0)'
        required: false
        default: 'v2.3.0'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: velora-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, Sign & Publish VELORA APK Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install API 36.1
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-36.1" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Resolve Release Version & Tag
        id: meta
        run: |
          GRADLE_VER=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version_tag }}" ]; then
            TAG_NAME="${{ inputs.version_tag }}"
            IS_PRERELEASE="${{ inputs.prerelease }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            IS_PRERELEASE="false"
          else
            TAG_NAME="v${GRADLE_VER:-2.3.0}"
            IS_PRERELEASE="false"
          fi
          VERSION_CLEAN="${TAG_NAME#v}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_CLEAN}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Prepare Signing Keystores & Environment
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          # Ensure debug.keystore is present
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Prepare release signing keystore strictly from CI secrets (zero hardcoded credentials)
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD_SECRET" ] && [ -n "$KEY_PASSWORD_SECRET" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${STORE_PASSWORD_SECRET}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASSWORD_SECRET}" >> "$GITHUB_ENV"
            cat <<EOF > ci-signing.properties
          KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks
          STORE_PASSWORD=${STORE_PASSWORD_SECRET}
          KEY_ALIAS=upload
          KEY_PASSWORD=${KEY_PASSWORD_SECRET}
          EOF
          else
            echo "::warning::Release signing secrets (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) are not configured in GitHub Actions Secrets."
          fi

      - name: Run Detekt & Unit Verification Suite
        run: ./gradlew detekt :app:testDebugUnitTest --tests com.example.ExampleUnitTest --parallel

      - name: Assemble Signed Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --parallel

      - name: Package Release Artifacts & Checksums
        id: package
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag_name }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/VELORA-v${VERSION}-release-signed.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/VELORA-v${VERSION}-universal-debug.apk"
          cd dist
          sha256sum VELORA-*.apk > SHA256SUMS.txt
          md5sum VELORA-*.apk > MD5SUMS.txt
          cat SHA256SUMS.txt

          {
            echo "## ✨ VELORA — Beyond Playback (${TAG})"
            echo ""
            echo "**VELORA ${TAG}** is an intelligent, privacy-first multimedia platform engineered with **Kotlin**, **Jetpack Compose (Material 3 Dark Saffron & Champagne Gold)**, **Media3 ExoPlayer**, a **10-Band Cascaded Peaking Biquad DSP Equalizer**, **Studio DSP Rack (Preamp, Sub-Bass Boost, 3D Stereo Width, A-B Loop, Smart Sleep Timer)**, **Live World & Persian Radio Tuner**, and **Sandboxed Declarative Plugins**."
            echo ""
            echo "### 🚀 What's New in ${TAG} (v2.3.0 — Phase 2 Complete)"
            echo "- **Local Listening Stats & Studio Recap**: Live dashboard of total listen minutes, total plays, Hi-Res masters count, top artists, and most-played tracks."
            echo "- **Rule-Based Smart Playlists Builder**: Create dynamic smart playlists filtered by minimum bitrate (kbps), sample rate (Hz), play count, favorites, and artist/title keywords."
            echo "- **In-App Synced .LRC Timestamp Studio**: Stamp real-time playback timestamps onto lyric lines, add new verses on the fly, and export standard \`.LRC\` files."
            echo "- **Cinema Video Swipe Gestures & Styled Subtitles**: Vertical swipe on left for screen brightness, right for volume, custom subtitle font scaling & color contrast themes, and scene bookmarking."
            echo "- **Standard .M3U / .M3U8 Import & Export + JSON Snapshot Restore**: Full playlist portability and one-tap offline backup/restore."
            echo "- **Precision Seek, Offline Tag Editor & Signal Pipeline Transparency**."
            echo ""
            echo "### 📥 Direct APK Downloads (دانلود مستقیم نسخه نصبی اندروید)"
            echo ""
            echo "| File | Type | Architecture | Android Version |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **\`VELORA-v${VERSION}-release-signed.apk\`** | **Recommended Production APK** (Signed Release) | Universal (\`arm64-v8a\`, \`armeabi-v7a\`, \`x86_64\`) | Android 8.0+ (API 26+) |"
            echo "| **\`VELORA-v${VERSION}-universal-debug.apk\`** | Developer / Testing APK | Universal (\`arm64-v8a\`, \`armeabi-v7a\`, \`x86_64\`) | Android 8.0+ (API 26+) |"
            echo "| **\`SHA256SUMS.txt\`** | SHA-256 Checksum Manifest | Text | — |"
            echo ""
            echo "### 🔐 SHA-256 Checksums"
            echo "\`\`\`text"
            cat SHA256SUMS.txt
            echo "\`\`\`"
          } > RELEASE_NOTES.md

      - name: Upload APK Bundle to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VELORA-${{ steps.meta.outputs.tag_name }}-apk-bundle
          path: |
            dist/VELORA-*.apk
            dist/SHA256SUMS.txt
            dist/MD5SUMS.txt
          if-no-files-found: error

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag_name }}"
          VERSION="${{ steps.meta.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG" -m "VELORA ${TAG}" || true
          git push origin "$TAG" --force || true

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "VELORA ${TAG} — Beyond Playback" \
              --notes-file dist/RELEASE_NOTES.md \
              --latest
            gh release upload "$TAG" \
              "dist/VELORA-v${VERSION}-release-signed.apk" \
              "dist/VELORA-v${VERSION}-universal-debug.apk" \
              "dist/SHA256SUMS.txt" \
              "dist/MD5SUMS.txt" \
              --clobber
          else
            gh release create "$TAG" \
              --target "${GITHUB_SHA}" \
              "dist/VELORA-v${VERSION}-release-signed.apk" \
              "dist/VELORA-v${VERSION}-universal-debug.apk" \
              "dist/SHA256SUMS.txt" \
              "dist/MD5SUMS.txt" \
              --title "VELORA ${TAG} — Beyond Playback" \
              --notes-file dist/RELEASE_NOTES.md \
              --latest
          fi
