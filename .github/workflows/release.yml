name: VELORA Release & APK Publisher

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v2.3.0)'
        required: false
        default: 'v2.3.1'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: velora-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, Sign & Publish VELORA APK Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Reject already-existing tag (dispatch guard)
        run: |
          # FIRST step: refuse to build or publish if the requested tag already
          # exists. Runs before checkout, keystore decode, or any build, so a
          # re-run of an old dispatch can never re-sign or replace an existing
          # release (B-VEL-01).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQ_TAG="$(echo "${{ inputs.version_tag }}" | tr -d '[:space:]')"
            REQ_TAG="v${REQ_TAG#v}"
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              REF_TAG="${GITHUB_REF#refs/tags/}"
              if [ "$REQ_TAG" != "$REF_TAG" ]; then
                echo "::error::workflow_dispatch on tag ${REF_TAG} but version_tag is ${REQ_TAG} — mismatch. Refusing to run."
                exit 1
              fi
            fi
            if git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}.git" "refs/tags/${REQ_TAG}" >/dev/null 2>&1; then
              echo "::error::Tag ${REQ_TAG} already exists — refusing to rebuild or republish it. Choose a new version_tag."
              exit 1
            fi
            echo "Dispatch guard passed: tag ${REQ_TAG} does not exist yet."
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "Tag-push run for ${GITHUB_REF} — dispatch guard skipped."
          else
            echo "Run triggered by ${{ github.event_name }} — dispatch guard skipped."
          fi

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install API 36 / 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$SDK_ROOT/licenses/android-googletv-license"
          printf "\nceff83576aac4f7f37cb98fe189e9fb3c49d3b81\n" > "$SDK_ROOT/licenses/android-googlexr-license"

          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platforms;android-36" > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platforms;android-36.1" > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Resolve Release Version & Tag
        id: meta
        run: |
          GRADLE_VER="2.3.0"
          if [ -f VERSION ]; then
            GRADLE_VER=$(tr -d '[:space:]' < VERSION)
            GRADLE_VER="${GRADLE_VER#v}"
          fi
          if [ -z "$GRADLE_VER" ]; then
            GRADLE_VER="2.3.0"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version_tag }}" ]; then
            RAW_TAG=$(echo "${{ inputs.version_tag }}" | tr -d '[:space:]')
            VERSION_CLEAN="${RAW_TAG#v}"
            TAG_NAME="v${VERSION_CLEAN}"
            IS_PRERELEASE="${{ inputs.prerelease }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            VERSION_CLEAN="${RAW_TAG#v}"
            TAG_NAME="v${VERSION_CLEAN}"
            if [[ "$VERSION_CLEAN" == *-* ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          else
            VERSION_CLEAN="${GRADLE_VER}"
            TAG_NAME="v${VERSION_CLEAN}"
            IS_PRERELEASE="false"
          fi

          printf '%s\n' "$VERSION_CLEAN" > VERSION
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_CLEAN}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved VELORA Release: tag=${TAG_NAME}, version=${VERSION_CLEAN}, prerelease=${IS_PRERELEASE}"

      - name: Prepare Signing Keystores & Environment
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          # Ensure debug.keystore is present and valid
          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Prepare release signing keystore: repository secrets are REQUIRED.
          # FAIL FAST if they are missing or invalid (c0151ce behaviour, restored).
          # An ephemeral/throwaway key must NEVER sign a published release: the
          # private key is deleted after the run, so users of that build can never
          # update to a future release (Android signature mismatch). See B-VEL-03:
          # v2.3.0 (2026-11-12) was signed with such a key and is un-updatable.
          KEYSTORE_READY="false"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD_SECRET" ] && [ -n "$KEY_PASSWORD_SECRET" ]; then
            if printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > my-upload-key.jks 2>/dev/null; then
              if keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD_SECRET" -alias upload >/dev/null 2>&1; then
                KEYSTORE_READY="true"
                ACTIVE_STORE_PASS="$STORE_PASSWORD_SECRET"
                ACTIVE_KEY_PASS="$KEY_PASSWORD_SECRET"
                echo "✅ Release keystore decoded and verified from GitHub Secrets."
                # Trial-sign a probe: keytool -list only proves the STORE password,
                # not the KEY password. A wrong KEY_PASSWORD must fail here with a
                # clear error — not halfway through the Gradle build.
                PROBE_DIR="$(mktemp -d)"
                echo "velora-sign-probe" > "$PROBE_DIR/probe.txt"
                (cd "$PROBE_DIR" && jar cf probe.jar probe.txt)
                if ! jarsigner -keystore my-upload-key.jks \
                    -storepass "$ACTIVE_STORE_PASS" -keypass "$ACTIVE_KEY_PASS" \
                    -signedjar "$PROBE_DIR/probe-signed.jar" "$PROBE_DIR/probe.jar" upload \
                    > "$PROBE_DIR/jarsigner.log" 2>&1; then
                  echo "::error::KEY_PASSWORD is invalid for alias 'upload' in the release keystore."
                  cat "$PROBE_DIR/jarsigner.log"
                  rm -rf "$PROBE_DIR" my-upload-key.jks
                  exit 1
                fi
                rm -rf "$PROBE_DIR"
                echo "✅ KEY_PASSWORD verified (trial signature succeeded)."
              else
                echo "::error::Configured RELEASE_KEYSTORE_BASE64 / STORE_PASSWORD did not match alias 'upload'."
                rm -f my-upload-key.jks
              fi
            else
              echo "::error::RELEASE_KEYSTORE_BASE64 could not be base64-decoded."
            fi
          fi

          if [ "$KEYSTORE_READY" != "true" ]; then
            echo "::error::Release signing secrets (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) are missing or invalid. Configure them in Settings > Secrets and variables > Actions and re-run. Refusing to sign a release with an ephemeral key (see B-VEL-03)."
            exit 1
          fi

          # KEYSTORE_PATH is a path, not a secret — it stays in $GITHUB_ENV.
          # STORE_PASSWORD / KEY_PASSWORD are scoped to the assemble step only
          # (env: on that step) and never exported to $GITHUB_ENV.
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
          printf 'KEYSTORE_PATH=%s/my-upload-key.jks\nSTORE_PASSWORD=%s\nKEY_ALIAS=upload\nKEY_PASSWORD=%s\n' \
            "${GITHUB_WORKSPACE}" "${ACTIVE_STORE_PASS}" "${ACTIVE_KEY_PASS}" > ci-signing.properties

      - name: Run Detekt & Unit Verification Suite
        run: ./gradlew detekt :app:testDebugUnitTest --tests com.example.ExampleUnitTest --tests com.example.DspBiquadMathTest --tests com.example.DownloadValidatorSecurityTest --tests com.example.FullscreenPolicyTest -Pvelora.versionName="${{ steps.meta.outputs.version }}" --parallel

      - name: Assemble Signed Release & Debug APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleDebug -Pvelora.versionName="${{ steps.meta.outputs.version }}" --parallel

      - name: Verify & Package Release Artifacts & Checksums
        id: package
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag_name }}"
          mkdir -p dist

          cp app/build/outputs/apk/release/app-release.apk "dist/VELORA-v${VERSION}-release-signed.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/VELORA-v${VERSION}-universal-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/VELORA-v${VERSION}-universal-debug.apk"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found — cannot verify the release APK signature. Refusing to publish an unverified APK."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "dist/VELORA-v${VERSION}-release-signed.apk"
          # Fingerprint check: the release APK must be signed by the configured
          # upload keystore — never the debug key or a throwaway key (B-VEL-03).
          EXPECTED_FP="$(keytool -list -v -keystore "${KEYSTORE_PATH:-${GITHUB_WORKSPACE}/my-upload-key.jks}" -storepass "$STORE_PASSWORD" -alias upload 2>/dev/null | grep -i 'SHA256:' | awk '{print $2}' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_FP="$("$APKSIGNER" verify --print-certs "dist/VELORA-v${VERSION}-release-signed.apk" 2>/dev/null | grep -i 'SHA-256 digest' | head -n 1 | awk '{print $NF}' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$EXPECTED_FP" ] || [ -z "$ACTUAL_FP" ] || [ "$EXPECTED_FP" != "$ACTUAL_FP" ]; then
            echo "::error::Release APK certificate fingerprint does not match the configured upload keystore; refusing debug or unexpected signing."
            exit 1
          fi
          echo "✅ Release APK fingerprint matches the configured upload keystore (${ACTUAL_FP})."

          cd dist
          sha256sum VELORA-*.apk > SHA256SUMS.txt
          md5sum VELORA-*.apk > MD5SUMS.txt
          cat SHA256SUMS.txt

          {
            echo "## ✨ VELORA — Beyond Playback (${TAG})"
            echo ""
            echo "**VELORA ${TAG}** is an intelligent, privacy-first multimedia platform engineered with **Kotlin**, **Jetpack Compose (Material 3 Dark Saffron & Champagne Gold)**, **Media3 ExoPlayer**, a **10-Band Cascaded Peaking Biquad DSP Equalizer**, **Studio DSP Rack (Preamp, Sub-Bass Boost, 3D Stereo Width, A-B Loop, Smart Sleep Timer)**, **Live World & Persian Radio Tuner**, and **Sandboxed Declarative Plugins**."
            echo ""
            echo "### 🚀 What's New in ${TAG}"
            echo "- **Local Listening Stats & Studio Recap**: Live dashboard of total listen minutes, total plays, Hi-Res masters count, top artists, and most-played tracks."
            echo "- **Rule-Based Smart Playlists Builder**: Create dynamic smart playlists filtered by minimum bitrate (kbps), sample rate (Hz), play count, favorites, and artist/title keywords."
            echo "- **In-App Synced .LRC Timestamp Studio**: Stamp real-time playback timestamps onto lyric lines, add new verses on the fly, and export standard \`.LRC\` files."
            echo "- **Cinema Video Swipe Gestures & Styled Subtitles**: Vertical swipe on left for screen brightness, right for volume, custom subtitle font scaling & color contrast themes, and scene bookmarking."
            echo "- **Standard .M3U / .M3U8 Import & Export + JSON Snapshot Restore**: Full playlist portability and one-tap offline backup/restore."
            echo "- **Precision Seek, Offline Tag Editor & Signal Pipeline Transparency**."
            echo ""
            echo "### 📥 Direct APK Downloads (دانلود مستقیم نسخه نصبی اندروید)"
            echo ""
            echo "| File | Type | Architecture | Android Version |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **\`VELORA-v${VERSION}-release-signed.apk\`** | **Recommended Production APK** (Signed & R8 Optimized) | Universal (\`arm64-v8a\`, \`armeabi-v7a\`, \`x86_64\`) | Android 8.0+ (API 26 – API 36) |"
            echo "| **\`VELORA-v${VERSION}-universal-release.apk\`** | Universal Signed Release Mirror | Universal (\`arm64-v8a\`, \`armeabi-v7a\`, \`x86_64\`) | Android 8.0+ (API 26 – API 36) |"
            echo "| **\`VELORA-v${VERSION}-universal-debug.apk\`** | Developer / Diagnostic APK | Universal (\`arm64-v8a\`, \`armeabi-v7a\`, \`x86_64\`) | Android 8.0+ (API 26 – API 36) |"
            echo "| **\`SHA256SUMS.txt\`** | SHA-256 Checksum Manifest | Text | — |"
            echo ""
            echo "### 🔐 SHA-256 Checksums"
            echo "\`\`\`text"
            cat SHA256SUMS.txt
            echo "\`\`\`"
          } > RELEASE_NOTES.md

      - name: Upload APK Bundle to Workflow Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VELORA-${{ steps.meta.outputs.tag_name }}-apk-bundle
          path: |
            dist/VELORA-*.apk
            dist/SHA256SUMS.txt
            dist/MD5SUMS.txt
          if-no-files-found: error

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag_name }}"
          VERSION="${{ steps.meta.outputs.version }}"
          IS_PRERELEASE="${{ steps.meta.outputs.prerelease }}"
          REPO="${{ github.repository }}"
          COMMIT_SHA="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Tags are never moved: --force on tags is forbidden. A dispatch may
          # create a tag only if it does not already exist; a tag push already has one.
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::Tag ${TAG} already exists — refusing to move it. Choose a new version."
              exit 1
            fi
            git tag -a "$TAG" "$COMMIT_SHA" -m "VELORA ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

          ASSETS=(
            "dist/VELORA-v${VERSION}-release-signed.apk"
            "dist/VELORA-v${VERSION}-universal-release.apk"
            "dist/VELORA-v${VERSION}-universal-debug.apk"
            "dist/SHA256SUMS.txt"
            "dist/MD5SUMS.txt"
          )

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Updating existing GitHub Release ${TAG}..."
            if [ "$IS_PRERELEASE" = "true" ]; then
              gh release edit "$TAG" \
                --repo "$REPO" \
                --title "VELORA ${TAG} — Beyond Playback" \
                --notes-file dist/RELEASE_NOTES.md \
                --prerelease \
                --draft=false || \
              gh release edit "$TAG" \
                --repo "$REPO" \
                --title "VELORA ${TAG} — Beyond Playback" \
                --notes-file dist/RELEASE_NOTES.md
            else
              gh release edit "$TAG" \
                --repo "$REPO" \
                --title "VELORA ${TAG} — Beyond Playback" \
                --notes-file dist/RELEASE_NOTES.md \
                --prerelease=false \
                --draft=false \
                --latest || \
              gh release edit "$TAG" \
                --repo "$REPO" \
                --title "VELORA ${TAG} — Beyond Playback" \
                --notes-file dist/RELEASE_NOTES.md
            fi
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$REPO" --clobber
          else
            echo "Creating new GitHub Release ${TAG}..."
            if [ "$IS_PRERELEASE" = "true" ]; then
              gh release create "$TAG" "${ASSETS[@]}" \
                --repo "$REPO" \
                --target "$COMMIT_SHA" \
                --title "VELORA ${TAG} — Beyond Playback" \
                --notes-file dist/RELEASE_NOTES.md \
                --prerelease || \
              gh release create "$TAG" "${ASSETS[@]}" \
                --repo "$REPO" \
                --title "VELORA ${TAG} — Beyond Playback" \
                --notes-file dist/RELEASE_NOTES.md
            else
              gh release create "$TAG" "${ASSETS[@]}" \
                --repo "$REPO" \
                --target "$COMMIT_SHA" \
                --title "VELORA ${TAG} — Beyond Playback" \
                --notes-file dist/RELEASE_NOTES.md \
                --latest || \
              gh release create "$TAG" "${ASSETS[@]}" \
                --repo "$REPO" \
                --title "VELORA ${TAG} — Beyond Playback" \
                --notes-file dist/RELEASE_NOTES.md
            fi
          fi
          rm -f my-upload-key.jks ci-signing.properties

      - name: Remove signing material (always)
        if: always()
        run: rm -f my-upload-key.jks ci-signing.properties
