name: VELORA v2.5.3 Emulator Performance

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/androidTest/java/com/example/PerformanceInstrumentedTest.kt'
      - '.github/workflows/performance-v253.yml'

permissions:
  contents: read

concurrency:
  group: velora-v253-emulator-performance
  cancel-in-progress: true

jobs:
  emulator-performance:
    name: Android Emulator Memory & CPU measurements
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout v2.5.3 test harness
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run instrumentation on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.example.PerformanceInstrumentedTest \
              -Pvelora.versionName=2.5.3 \
              --no-daemon --stacktrace
            adb logcat -d -v threadtime -s VeloraPerf:I '*:S' | tee perf-metrics.log
            adb shell dumpsys meminfo com.aistudio.fazora.audiosync | tee meminfo-after-test.txt || true

      - name: Validate and summarize performance metrics
        shell: bash
        run: |
          test -s perf-metrics.log
          grep 'METRIC version=2.5.3' perf-metrics.log
          awk '/METRIC version=2.5.3/ {print}' perf-metrics.log > v2.5.3-performance-metrics.txt
          cat v2.5.3-performance-metrics.txt

      - name: Upload emulator performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: VELORA-v2.5.3-emulator-performance
          if-no-files-found: error
          path: |
            perf-metrics.log
            v2.5.3-performance-metrics.txt
            meminfo-after-test.txt
