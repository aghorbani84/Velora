name: VELORA Android CI

on:
  push:
    branches: [ "main", "master", "develop", "kotlin-rewrite", "phase-*", "feature/*", "feat/*", "fix/*" ]
  pull_request:
    branches: [ "main", "master", "develop", "kotlin-rewrite" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velora-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-and-hygiene-scan:
    name: Secrets & Keystore Hygiene Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify Zero Committed Upload Keystores or Raw API Keys
        run: |
          if [ -f "my-upload-key.jks" ] || [ -f "my-upload-key.jks.base64" ]; then
            echo "::error::Upload keystore detected in repository tree!"
            exit 1
          fi
          if grep -rnE "AIza[0-9A-Za-z_-]{35}" app/src/ ; then
            echo "::error::Hardcoded API key detected in source code!"
            exit 1
          fi
          echo "Secrets & keystore hygiene check passed."

  build-and-verify:
    name: Detekt, Lint, Unit Suites & APK Verification
    runs-on: ubuntu-latest
    needs: secrets-and-hygiene-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install API 36 / 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$SDK_ROOT/licenses/android-googletv-license"
          printf "\nceff83576aac4f7f37cb98fe189e9fb3c49d3b81\n" > "$SDK_ROOT/licenses/android-googlexr-license"

          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platforms;android-36" > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platforms;android-36.1" > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Prepare Gradle Wrapper, Environment & Signing Keystores
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          KEYSTORE_READY="false"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD_SECRET" ] && [ -n "$KEY_PASSWORD_SECRET" ]; then
            if printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > my-upload-key.jks 2>/dev/null; then
              if keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD_SECRET" -alias upload >/dev/null 2>&1; then
                KEYSTORE_READY="true"
                ACTIVE_STORE_PASS="$STORE_PASSWORD_SECRET"
                ACTIVE_KEY_PASS="$KEY_PASSWORD_SECRET"
                # Trial-sign a probe: keytool -list only proves the STORE password,
                # not the KEY password. A wrong KEY_PASSWORD must fail here with a
                # clear error — not halfway through the Gradle build.
                PROBE_DIR="$(mktemp -d)"
                echo "velora-sign-probe" > "$PROBE_DIR/probe.txt"
                (cd "$PROBE_DIR" && jar cf probe.jar probe.txt)
                if ! jarsigner -keystore my-upload-key.jks \
                    -storepass "$ACTIVE_STORE_PASS" -keypass "$ACTIVE_KEY_PASS" \
                    -signedjar "$PROBE_DIR/probe-signed.jar" "$PROBE_DIR/probe.jar" upload \
                    > "$PROBE_DIR/jarsigner.log" 2>&1; then
                  echo "::error::KEY_PASSWORD is invalid for alias 'upload' in the release keystore."
                  cat "$PROBE_DIR/jarsigner.log"
                  rm -rf "$PROBE_DIR" my-upload-key.jks
                  exit 1
                fi
                rm -rf "$PROBE_DIR"
                echo "✅ KEY_PASSWORD verified (trial signature succeeded)."
              else
                rm -f my-upload-key.jks
              fi
            fi
          fi

          # CI never generates an ephemeral release keystore: an APK signed with a
          # throwaway key is un-updatable (B-VEL-03). Without real secrets the CI
          # run builds debug only; the release step below is skipped.
          if [ "$KEYSTORE_READY" != "true" ]; then
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No valid release signing secrets — release APK skipped in this CI run (debug APK still built)."
          else
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
            # KEYSTORE_PATH is a path, not a secret — it stays in $GITHUB_ENV.
            # STORE_PASSWORD / KEY_PASSWORD are scoped to the assemble step only
            # (env: on that step) and never exported to $GITHUB_ENV.
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
          fi

      - name: Run Detekt, Unit Test Suites & Assemble Debug APK
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          VERSION="${VERSION#v}"
          ./gradlew detekt :app:testDebugUnitTest --tests com.example.ExampleUnitTest --tests com.example.DspBiquadMathTest --tests com.example.DownloadValidatorSecurityTest --tests com.example.FullscreenPolicyTest assembleDebug -Pvelora.versionName="${VERSION:-2.3.0}" --parallel

      - name: Assemble Release APK (real keystore only)
        if: steps.keystore.outputs.release_ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          VERSION="${VERSION#v}"
          ./gradlew assembleRelease -Pvelora.versionName="${VERSION:-2.3.0}" --parallel

      - name: Verify & Package Release APK (upload keystore only)
        if: steps.keystore.outputs.release_ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          VERSION="${VERSION#v}"
          VERSION="${VERSION:-2.3.0}"
          mkdir -p build-artifacts
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Release APK was not built (expected $APK)."
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found — cannot verify the release APK signature. Refusing to package an unverified APK."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          # Fingerprint check: the release APK must be signed by the configured
          # upload keystore — never the debug key or a throwaway key (B-VEL-03).
          EXPECTED_FP="$(keytool -list -v -keystore "${KEYSTORE_PATH:-${GITHUB_WORKSPACE}/my-upload-key.jks}" -storepass "$STORE_PASSWORD" -alias upload 2>/dev/null | grep -i 'SHA256:' | awk '{print $2}' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_FP="$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -i 'SHA-256 digest' | head -n 1 | awk '{print $NF}' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$EXPECTED_FP" ] || [ -z "$ACTUAL_FP" ] || [ "$EXPECTED_FP" != "$ACTUAL_FP" ]; then
            echo "::error::Release APK certificate fingerprint does not match the configured upload keystore; refusing debug or unexpected signing."
            exit 1
          fi
          echo "✅ Release APK fingerprint matches the configured upload keystore (${ACTUAL_FP})."
          cp "$APK" "build-artifacts/VELORA-v${VERSION}-release-signed.apk"

      - name: Package & Checksum APKs
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          VERSION="${VERSION#v}"
          VERSION="${VERSION:-2.3.0}"
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "build-artifacts/VELORA-v${VERSION}-debug.apk"
          cd build-artifacts
          sha256sum VELORA-*.apk > "VELORA-v${VERSION}-SHA256SUMS.txt"
          rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"

      - name: Upload VELORA APK Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VELORA-android-apks
          path: |
            build-artifacts/VELORA-*.apk
            build-artifacts/VELORA-*SHA256SUMS.txt
          if-no-files-found: error

      - name: Remove signing material (always)
        if: always()
        run: rm -f my-upload-key.jks ci-signing.properties
