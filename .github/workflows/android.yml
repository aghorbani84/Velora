name: VELORA Android CI

on:
  push:
    branches: [ "main", "master", "develop", "kotlin-rewrite", "phase-*", "feature/*" ]
  pull_request:
    branches: [ "main", "master", "develop", "kotlin-rewrite" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velora-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Static Analysis, Unit Tests & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install API 36.1
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-36.1" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Prepare Gradle Wrapper, Environment & Debug Keystore
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Detekt, Unit Tests & Assemble Debug APK
        run: ./gradlew detekt :app:testDebugUnitTest --tests com.example.ExampleUnitTest assembleDebug --parallel

      - name: Package & Checksum APK
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/VELORA-debug.apk
          cd build-artifacts
          sha256sum VELORA-debug.apk > VELORA-debug.apk.sha256

      - name: Upload VELORA APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELORA-android-debug-apk
          path: |
            build-artifacts/VELORA-debug.apk
            build-artifacts/VELORA-debug.apk.sha256
          if-no-files-found: error
