name: VELORA Android CI

on:
  push:
    branches: [ "main", "master", "develop", "kotlin-rewrite", "phase-*", "feature/*", "feat/*" ]
  pull_request:
    branches: [ "main", "master", "develop", "kotlin-rewrite" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velora-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-and-hygiene-scan:
    name: Secrets & Keystore Hygiene Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Zero Committed Upload Keystores or Raw API Keys
        run: |
          if [ -f "my-upload-key.jks" ] || [ -f "my-upload-key.jks.base64" ]; then
            echo "::error::Upload keystore detected in repository tree!"
            exit 1
          fi
          if grep -rnE "AIza[0-9A-Za-z_-]{35}" app/src/ ; then
            echo "::error::Hardcoded API key detected in source code!"
            exit 1
          fi
          echo "Secrets & keystore hygiene check passed."

  build-and-verify:
    name: Detekt, Lint, Unit Suites & APK Verification
    runs-on: ubuntu-latest
    needs: secrets-and-hygiene-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install API 36.1
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-36.1" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Prepare Gradle Wrapper, Environment & Debug Keystore
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Detekt, Unit Test Suites & Assemble Debug APK
        run: ./gradlew detekt :app:testDebugUnitTest --tests com.example.ExampleUnitTest --tests com.example.DspBiquadMathTest --tests com.example.DownloadValidatorSecurityTest assembleDebug --parallel

      - name: Package & Checksum APK
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "build-artifacts/VELORA-v${VERSION}-debug.apk"
          cd build-artifacts
          sha256sum "VELORA-v${VERSION}-debug.apk" > "VELORA-v${VERSION}-debug.apk.sha256"

      - name: Upload VELORA APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELORA-android-debug-apk
          path: |
            build-artifacts/VELORA-*.apk
            build-artifacts/VELORA-*.sha256
          if-no-files-found: error
