<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" role="img" aria-label="VELORA — Beyond Playback">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0D" />
      <stop offset="55%" stop-color="#121216" />
      <stop offset="100%" stop-color="#19191F" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C88712" />
      <stop offset="50%" stop-color="#E5A817" />
      <stop offset="100%" stop-color="#F5C451" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9BD83" />
      <stop offset="100%" stop-color="#BDA36B" />
    </linearGradient>
    <radialGradient id="saffronGlow" cx="78%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#E5A817" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#C88712" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0B0B0D" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Obsidian Canvas -->
  <rect width="1200" height="380" rx="20" fill="url(#bgGrad)" stroke="#2A2927" stroke-width="2" />
  <rect width="1200" height="380" rx="20" fill="url(#saffronGlow)" />

  <!-- Subtle Golden Ratio Grid Lines -->
  <line x1="741.6" y1="0" x2="741.6" y2="380" stroke="#2A2927" stroke-width="1" stroke-dasharray="4 6" opacity="0.65" />
  <line x1="0" y1="234.8" x2="1200" y2="234.8" stroke="#2A2927" stroke-width="1" stroke-dasharray="4 6" opacity="0.45" />

  <!-- Top Pill Badge -->
  <rect x="64" y="48" width="320" height="30" rx="15" fill="#19191F" stroke="#2A2927" stroke-width="1" />
  <circle cx="82" cy="63" r="4.5" fill="#E5A817" />
  <text x="96" y="68" fill="#D9BD83" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.8">
    INTELLIGENT MULTIMEDIA ECOSYSTEM
  </text>

  <!-- Main Brand Title: VELORA -->
  <text x="62" y="156" fill="#F5F2EB" font-family="Space Grotesk, Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="76" font-weight="800" letter-spacing="6">
    VELORA
  </text>

  <!-- Tagline: Beyond Playback. -->
  <text x="66" y="198" fill="url(#saffronGrad)" font-family="Space Grotesk, Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="600" letter-spacing="1.2">
    Beyond Playback.
  </text>

  <!-- Subtitle Description -->
  <text x="66" y="242" fill="#A5A29B" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15.5" font-weight="400">
    Universal Audio &amp; Video Engine • 10-Band Biquad DSP &amp; RTA • OmniSearch • Media Copilot • Sandboxed Plugins
  </text>

  <!-- Feature Pills -->
  <g transform="translate(66, 276)" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">
    <rect x="0" y="0" width="136" height="34" rx="8" fill="#202027" stroke="#E5A817" stroke-width="1" stroke-opacity="0.45" />
    <text x="68" y="21" fill="#F5C451" text-anchor="middle">Kotlin 2.2.10</text>

    <rect x="148" y="0" width="154" height="34" rx="8" fill="#202027" stroke="#2A2927" stroke-width="1" />
    <text x="225" y="21" fill="#F5F2EB" text-anchor="middle">Media3 ExoPlayer</text>

    <rect x="314" y="0" width="150" height="34" rx="8" fill="#202027" stroke="#2A2927" stroke-width="1" />
    <text x="389" y="21" fill="#D9BD83" text-anchor="middle">10-Band IIR DSP</text>

    <rect x="476" y="0" width="144" height="34" rx="8" fill="#202027" stroke="#2A2927" stroke-width="1" />
    <text x="548" y="21" fill="#A5A29B" text-anchor="middle">Room v3 + Koin</text>
  </g>

  <!-- Right Side: Acoustic & Golden Ratio Visualizer Emblem -->
  <g transform="translate(955, 190)">
    <!-- Outer Golden Rings -->
    <circle cx="0" cy="0" r="128" fill="#121216" stroke="#2A2927" stroke-width="1.5" />
    <circle cx="0" cy="0" r="102" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6 4" opacity="0.55" />
    <circle cx="0" cy="0" r="74" fill="#19191F" stroke="#E5A817" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- 10-Band RTA Spectrum Bars inside Emblem -->
    <g transform="translate(-54, 0)">
      <rect x="0"   y="-18" width="7" height="36" rx="3.5" fill="#C88712" />
      <rect x="12"  y="-34" width="7" height="68" rx="3.5" fill="#E5A817" />
      <rect x="24"  y="-48" width="7" height="96" rx="3.5" fill="#F5C451" />
      <rect x="36"  y="-28" width="7" height="56" rx="3.5" fill="#E5A817" />
      <rect x="48"  y="-56" width="7" height="112" rx="3.5" fill="url(#saffronGrad)" />
      <rect x="60"  y="-42" width="7" height="84" rx="3.5" fill="#F5C451" />
      <rect x="72"  y="-24" width="7" height="48" rx="3.5" fill="#D9BD83" />
      <rect x="84"  y="-38" width="7" height="76" rx="3.5" fill="#E5A817" />
      <rect x="96"  y="-20" width="7" height="40" rx="3.5" fill="#C88712" />
      <rect x="108" y="-12" width="7" height="24" rx="3.5" fill="#BDA36B" />
    </g>

    <!-- Label below emblem -->
    <text x="0" y="108" fill="#77746E" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle" letter-spacing="1.5">
      DARK SAFFRON • #E5A817
    </text>
  </g>
</svg>
